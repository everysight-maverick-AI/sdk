# The iOS target links Kotlin/Native, which runs in its own daemon - the Gradle heap below
# does not cover it. Give that daemon its own ceiling so a framework link cannot fail with
# OutOfMemoryError on a machine that has the memory to spare.
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx4096M"
android.useAndroidX=true
kotlin.code.style=official
sdkVersion=0.2.0
